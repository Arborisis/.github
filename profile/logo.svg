<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a8b3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#1a3d16" stroke-width="3"/>
  
  <!-- Tree trunk -->
  <rect x="92" y="120" width="16" height="50" rx="3" fill="#5c3a1e"/>
  
  <!-- Tree canopy -->
  <ellipse cx="100" cy="90" rx="55" ry="45" fill="#6bb85a" opacity="0.9"/>
  <ellipse cx="100" cy="75" rx="40" ry="35" fill="#7fc96e" opacity="0.9"/>
  <ellipse cx="100" cy="65" rx="25" ry="20" fill="#9ad98c" opacity="0.9"/>
  
  <!-- Sound waves -->
  <path d="M 145 95 Q 160 85, 170 95 Q 160 105, 145 95" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 150 100 Q 168 88, 178 100 Q 168 112, 150 100" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Leaves details -->
  <circle cx="75" cy="85" r="8" fill="#5aa84a" opacity="0.7"/>
  <circle cx="125" cy="80" r="10" fill="#5aa84a" opacity="0.7"/>
  <circle cx="85" cy="65" r="7" fill="#6bb85a" opacity="0.8"/>
  <circle cx="115" cy="60" r="9" fill="#6bb85a" opacity="0.8"/>
  
  <!-- Ground -->
  <ellipse cx="100" cy="165" rx="60" ry="8" fill="#3d7a30" opacity="0.4"/>
</svg>