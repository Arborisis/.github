name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_MAIN: 213.199.53.8
  VPS_WORKER1: 157.173.109.156
  VPS_WORKER2: 157.173.109.82

jobs:
  deploy-main:
    name: Deploy Main App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $VPS_MAIN >> ~/.ssh/known_hosts

      - name: Deploy to Main VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 root@$VPS_MAIN << 'EOF'
            cd /opt/arborisis
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose exec -T app php artisan migrate --force 2>/dev/null || true
            docker compose exec -T app php artisan optimize 2>/dev/null || true
            docker compose exec -T app php artisan queue:restart 2>/dev/null || true
          EOF

  deploy-workers:
    name: Deploy Audio Workers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [157.173.109.156, 157.173.109.82]
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

      - name: Deploy Worker
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ matrix.host }} << 'EOF'
            cd /opt/arborisis-audio
            docker compose pull
            docker compose up -d --build
          EOF
